apply plugin: 'com.android.application'

// Upload keystore za Play release. Fajl NIKAD u repo (vidi .gitignore) — generisan
// jednom lokalno preko keytool-a, lozinke čuvane van repoa. Odsustvo fajla ne smije
// tiho srušiti svakodnevni `assembleStaging`/`assembleDebug`; provjera niže baca
// jasnu grešku SAMO kad se stvarno traži release/bundle task.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kartaonica.zandar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kartaonica.zandar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
        // Staging se instalira PORED produkcijske aplikacije (drugi applicationId),
        // pa se isti ekran moze uporediti prije nego promjena ode korisnicima.
        // `debug` i `release` se namjerno NE diraju: `dev-android.mjs` pokrece
        // `com.kartaonica.zandar/.MainActivity` zakucano, pa dev petlja ostaje ista.
        staging {
            initWith debug                 // debuggable + debug potpis -> instalira se bez release kljuca
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ['debug']  // capacitor-android moduli nemaju `staging` buildType
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// `assembleRelease`/`bundleRelease` bez keystore.properties bi tiho ispalo
// NEPOTPISANO umjesto da padne — AGP ne baca grešku samo zato što je
// signingConfig null. Ovo pretvara propust u jasnu poruku prije nego artefakt
// stigne do Play-a.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name in ["assembleRelease", "bundleRelease"] }
    if (wantsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "keystore.properties nedostaje (android/keystore.properties) — release/bundle " +
            "zahtijeva upload keystore. Vidi CLAUDE.md Deployment."
        )
    }
}

apply from: 'capacitor.build.gradle'

// Firebase (push obavještenja, PRD §51). Fajl ide PO BUILD TIPU, jer staging i
// produkcija imaju ODVOJENE Firebase projekte — isto pravilo kao volume:
//   src/debug/, src/release/  → produkcijski projekt (prod APK je zasad debug build)
//   src/staging/              → staging projekt
// Plugin se primjenjuje čim postoji bilo koji od njih; build tip bez svog fajla
// se i dalje gradi (WARN), a `scripts/build-mobile.mjs` mu ne uključuje push u
// web sloju — `register()` bez Firebase konfiguracije ruši aplikaciju.
def googleServicesFiles = [
    'google-services.json',
    'src/debug/google-services.json',
    'src/release/google-services.json',
    'src/staging/google-services.json',
]
if (googleServicesFiles.any { file(it).exists() }) {
    apply plugin: 'com.google.gms.google-services'
    googleServices {
        missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
