apply plugin: 'com.android.application'

android {
    namespace = "com.kartaonica.zandar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kartaonica.zandar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Staging se instalira PORED produkcijske aplikacije (drugi applicationId),
        // pa se isti ekran moze uporediti prije nego promjena ode korisnicima.
        // `debug` i `release` se namjerno NE diraju: `dev-android.mjs` pokrece
        // `com.kartaonica.zandar/.MainActivity` zakucano, pa dev petlja ostaje ista.
        staging {
            initWith debug                 // debuggable + debug potpis -> instalira se bez release kljuca
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ['debug']  // capacitor-android moduli nemaju `staging` buildType
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (push obavještenja, PRD §51). Fajl ide PO BUILD TIPU, jer staging i
// produkcija imaju ODVOJENE Firebase projekte — isto pravilo kao volume:
//   src/debug/, src/release/  → produkcijski projekt (prod APK je zasad debug build)
//   src/staging/              → staging projekt
// Plugin se primjenjuje čim postoji bilo koji od njih; build tip bez svog fajla
// se i dalje gradi (WARN), a `scripts/build-mobile.mjs` mu ne uključuje push u
// web sloju — `register()` bez Firebase konfiguracije ruši aplikaciju.
def googleServicesFiles = [
    'google-services.json',
    'src/debug/google-services.json',
    'src/release/google-services.json',
    'src/staging/google-services.json',
]
if (googleServicesFiles.any { file(it).exists() }) {
    apply plugin: 'com.google.gms.google-services'
    googleServices {
        missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
