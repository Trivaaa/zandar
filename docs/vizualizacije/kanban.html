<title>Kartaonica · zadaci</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: četiri kolone kao četiri gomile na stolu; kartica je karta koja se prenosi s gomile na gomilu. Telefon: kolone se listaju vodoravno. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f6f8f6; --ink:#14251d; --muted:#56685f; --line:#d3ddd6;
  --felt:#165a3f; --felt-soft:#dcebe2; --brass:#a87b12; --brass-soft:#f4e7c6;
  --bad:#b23a32; --bad-soft:#f6dedb; --warn:#b26a00; --scrim:rgba(10,24,18,.42);
  --a-proizvod:#165a3f; --a-infra:#3b5b7a; --a-marketing:#a87b12; --a-pravno:#7a4a63; --a-podaci:#1f7a78;
  --shadow:0 1px 2px rgba(20,37,29,.08),0 2px 6px rgba(20,37,29,.06);
  --shadow-lift:0 10px 28px rgba(20,37,29,.22);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a14; --surface:#112620; --surface-2:#0e211b; --ink:#e6efe9; --muted:#9bb0a5; --line:#24413a;
  --felt:#3fa679; --felt-soft:#173a2d; --brass:#e0b54a; --brass-soft:#3a3018;
  --bad:#ec7a70; --bad-soft:#3b1d1a; --warn:#e9a23b; --scrim:rgba(0,0,0,.6);
  --a-proizvod:#3fa679; --a-infra:#7fa6cc; --a-marketing:#e0b54a; --a-pravno:#c890ae; --a-podaci:#4cbdba;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 12px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a14; --surface:#112620; --surface-2:#0e211b; --ink:#e6efe9; --muted:#9bb0a5; --line:#24413a;
  --felt:#3fa679; --felt-soft:#173a2d; --brass:#e0b54a; --brass-soft:#3a3018;
  --bad:#ec7a70; --bad-soft:#3b1d1a; --warn:#e9a23b; --scrim:rgba(0,0,0,.6);
  --a-proizvod:#3fa679; --a-infra:#7fa6cc; --a-marketing:#e0b54a; --a-pravno:#c890ae; --a-podaci:#4cbdba;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 12px 30px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(30px,5vw,42px)}
h2{font-size:20px;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* zaglavlje */
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.title{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.eyebrow a{color:var(--felt);text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn--primary{background:var(--felt);border-color:var(--felt);color:var(--surface)}
.btn--danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn--ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}

.note{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;color:var(--muted)}
.note--bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}

/* tabla */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.col__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.col__count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col[data-col="week"] .col__head h2{color:var(--brass)}
.col[data-col="doing"] .col__head h2{color:var(--felt)}
.col__list{display:flex;flex-direction:column;gap:8px;padding:4px 10px 10px;min-height:72px}
.col__empty{color:var(--muted);font-size:13px;padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.col__add{margin:0 10px 12px;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--muted);font-weight:500;text-align:left}
.col__add:hover{color:var(--ink);border-color:var(--muted)}
.col.is-over{border-color:var(--felt)}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:var(--muted);border-left-color:var(--c,var(--line))}
.card__title{font-weight:600;overflow-wrap:anywhere}
.card__note{color:var(--muted);font-size:13px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card__meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px}
.prio{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.prio[data-p="visok"]{color:var(--bad);border-color:var(--bad)}
.prio[data-p="nizak"]{opacity:.75}
.due{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due.is-late{color:var(--bad);font-weight:600}
.col[data-col="done"] .card{opacity:.72}
.col[data-col="done"] .card__title{text-decoration:line-through;text-decoration-color:var(--muted)}
.card.is-dragging{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:var(--shadow-lift);transform-origin:center;cursor:grabbing}
.slot{height:var(--h,44px);border:2px dashed var(--felt);border-radius:10px;background:var(--felt-soft);flex:none}
body.dragging{cursor:grabbing}
body.dragging .card{cursor:grabbing}
.readonly .card{cursor:pointer}

/* telefon: kolone se listaju vodoravno */
@media (max-width:860px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:6px;
    margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .col{flex:0 0 min(84vw,340px);scroll-snap-align:start}
}

/* list za unos */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet__bar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-top:4px}
.sheet__bar .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;z-index:60}

@media (prefers-reduced-motion: no-preference){
  .card{transition:border-color .15s}
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div class="wrap" id="app">
  <header>
    <div class="title">
      <span class="eyebrow">Kartaonica · interno · <a href="https://claude.ai/artifact/Thf4yQbSPrcohoeZe8bNtK" target="_blank" rel="noopener">PMF pregled →</a></span>
      <h1>Zadaci</h1>
    </div>
    <div class="actions">
      <div class="filters" id="filters" role="group" aria-label="Filter po oblasti"></div>
      <button class="btn btn--primary" id="addBtn" type="button">+ Zadatak</button>
    </div>
  </header>
  <div id="status" class="note" role="status">Učitavam zadatke…</div>
  <main class="board" id="board" aria-label="Kanban tabla"></main>
</div>

<script>
(() => {
  const COLS = [
    { id: "backlog", name: "Backlog" },
    { id: "week", name: "Ova sedmica" },
    { id: "doing", name: "U radu" },
    { id: "done", name: "Gotovo" },
  ];
  const AREAS = [
    { id: "proizvod", name: "Proizvod" },
    { id: "infra", name: "Infra" },
    { id: "marketing", name: "Marketing" },
    { id: "podaci", name: "Podaci" },
    { id: "pravno", name: "Pravno" },
  ];
  const PRIOS = [{ id: "", name: "—" }, { id: "visok", name: "Visok" }, { id: "srednji", name: "Srednji" }, { id: "nizak", name: "Nizak" }];
  const areaName = id => (AREAS.find(a => a.id === id) || {}).name || id || "";
  const colName = id => (COLS.find(c => c.id === id) || {}).name || id;

  const $ = (s, el = document) => el.querySelector(s);
  const board = $("#board"), statusEl = $("#status"), addBtn = $("#addBtn"), filtersEl = $("#filters");

  let tasks = new Map();     // id -> data
  let db = null, coll = null;
  let canWrite = false;      // postaje true kad je db dostupan i pisanje nije zabranjeno
  let filter = null;
  let dragging = null;       // stanje prevlačenja
  let renderPending = false;

  // ---------- pomoćno ----------
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDue = iso => { const [y, m, d] = iso.split("-"); return `${+d}.${+m}.`; };
  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k === "style") n.setAttribute("style", v); else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }
  let toastTimer;
  function toast(msg) {
    let t = $(".toast"); if (!t) { t = el("div", { class: "toast", role: "status" }); document.body.append(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function setStatus(msg, bad) {
    if (!msg) { statusEl.hidden = true; return; }
    statusEl.hidden = false; statusEl.textContent = msg; statusEl.classList.toggle("note--bad", !!bad);
  }
  const sorted = colId => [...tasks.entries()].filter(([, t]) => t.column === colId)
    .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || a[0].localeCompare(b[0]));

  // ---------- filteri ----------
  function renderFilters() {
    filtersEl.replaceChildren();
    const all = el("button", { class: "chip", type: "button", "aria-pressed": String(filter === null), text: "Sve" });
    all.onclick = () => { filter = null; renderFilters(); render(); };
    filtersEl.append(all);
    for (const a of AREAS) {
      const b = el("button", { class: "chip", type: "button", "aria-pressed": String(filter === a.id), style: `--c:var(--a-${a.id})` },
        el("span", { class: "dot", "aria-hidden": "true" }), a.name);
      b.onclick = () => { filter = filter === a.id ? null : a.id; renderFilters(); render(); };
      filtersEl.append(b);
    }
  }

  // ---------- crtanje ----------
  function render() {
    if (dragging) { renderPending = true; return; }
    const today = todayISO();
    board.classList.toggle("readonly", !canWrite);
    addBtn.hidden = !canWrite;
    board.replaceChildren();
    for (const c of COLS) {
      const items = sorted(c.id);
      const shown = filter ? items.filter(([, t]) => t.area === filter) : items;
      const list = el("div", { class: "col__list", "data-col": c.id });
      for (const [id, t] of shown) {
        const late = t.due && t.due < today && c.id !== "done";
        const meta = el("div", { class: "card__meta" },
          t.area ? el("span", { class: "tag", style: `--c:var(--a-${t.area})` }, el("span", { class: "dot", "aria-hidden": "true" }), areaName(t.area)) : null,
          t.priority ? el("span", { class: "prio", "data-p": t.priority, text: t.priority }) : null,
          t.due ? el("span", { class: "due" + (late ? " is-late" : ""), title: late ? "Rok je prošao" : "Rok", text: (late ? "⚠ " : "") + fmtDue(t.due) }) : null);
        const card = el("article", { class: "card", "data-id": id, tabindex: "0", role: "button",
          "aria-label": `${t.title}, ${colName(c.id)}. Enter za izmjenu.`, style: t.area ? `--c:var(--a-${t.area})` : null },
          el("div", { class: "card__title", text: t.title || "(bez naslova)" }),
          t.note ? el("div", { class: "card__note", text: t.note }) : null,
          meta.childNodes.length ? meta : null);
        card.addEventListener("pointerdown", onPointerDown);
        card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(id); } });
        list.append(card);
      }
      if (!shown.length) list.append(el("div", { class: "col__empty", text: items.length ? "Nema zadataka za ovaj filter" : (canWrite ? "Prevuci karticu ovdje" : "Prazno") }));
      const col = el("section", { class: "col", "data-col": c.id, "aria-label": c.name },
        el("div", { class: "col__head" }, el("h2", { text: c.name }), el("span", { class: "col__count", text: filter ? `${shown.length}/${items.length}` : String(items.length) })),
        list);
      if (canWrite) {
        const add = el("button", { class: "col__add", type: "button", text: "+ Dodaj" });
        add.onclick = () => openSheet(null, c.id);
        col.append(add);
      }
      board.append(col);
    }
  }

  // ---------- prevlačenje (miš i dodir) ----------
  function onPointerDown(e) {
    if (e.button !== 0) return;
    const card = e.currentTarget, id = card.dataset.id;
    const start = { x: e.clientX, y: e.clientY, id, card, pointerId: e.pointerId, type: e.pointerType, armed: false, timer: null };
    const touch = e.pointerType !== "mouse";
    if (canWrite && touch) start.timer = setTimeout(() => { start.armed = true; begin(start, start.x, start.y); }, 220);

    const move = ev => {
      if (ev.pointerId !== start.pointerId) return;
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (dragging) { ev.preventDefault(); drag(ev.clientX, ev.clientY); return; }
      if (Math.hypot(dx, dy) > 6) {
        if (canWrite && !touch) begin(start, ev.clientX, ev.clientY);
        else { clearTimeout(start.timer); cleanup(); } // dodir koji skroluje
      }
    };
    const up = ev => {
      if (ev.pointerId !== start.pointerId) return;
      clearTimeout(start.timer);
      if (dragging) drop(ev.type === "pointercancel");
      else if (ev.type === "pointerup") openSheet(id);
      cleanup();
    };
    const cleanup = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  }
  // dok traje prevlačenje prstom, stranica se ne skroluje
  window.addEventListener("touchmove", e => { if (dragging) e.preventDefault(); }, { passive: false });

  function begin(start, x, y) {
    if (dragging) return;
    const r = start.card.getBoundingClientRect();
    const ghost = start.card.cloneNode(true);
    ghost.classList.add("ghost"); ghost.style.width = r.width + "px"; ghost.removeAttribute("tabindex");
    document.body.append(ghost);
    const slot = el("div", { class: "slot", style: `--h:${r.height}px` });
    start.card.after(slot);
    start.card.classList.add("is-dragging");
    document.body.classList.add("dragging");
    dragging = { id: start.id, card: start.card, ghost, slot, offX: x - r.left, offY: y - r.top, x, y, raf: 0 };
    if (navigator.vibrate && start.type === "touch") try { navigator.vibrate(12); } catch {}
    drag(x, y);
    autoScroll();
  }

  function drag(x, y) {
    const d = dragging; d.x = x; d.y = y;
    d.ghost.style.transform = `translate(${x - d.offX}px, ${y - d.offY}px) rotate(2deg)`;
    const under = document.elementFromPoint(x, y);
    const col = under && under.closest(".col");
    board.querySelectorAll(".col.is-over").forEach(c => c.classList.remove("is-over"));
    if (!col) return;
    col.classList.add("is-over");
    const list = $(".col__list", col);
    const cards = [...list.querySelectorAll(".card:not(.is-dragging)")];
    const before = cards.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
    const empty = $(".col__empty", list); if (empty) empty.hidden = true;
    if (before) { if (d.slot.nextSibling !== before) list.insertBefore(d.slot, before); }
    else if (list.lastElementChild !== d.slot) list.append(d.slot);
  }

  function autoScroll() {
    const d = dragging; if (!d) return;
    const edge = 56, vh = window.innerHeight;
    if (d.y < edge) window.scrollBy(0, -10); else if (d.y > vh - edge) window.scrollBy(0, 10);
    const br = board.getBoundingClientRect();
    if (board.scrollWidth > board.clientWidth) {
      if (d.x < br.left + edge) board.scrollLeft -= 12; else if (d.x > br.right - edge) board.scrollLeft += 12;
    }
    drag(d.x, d.y);
    d.raf = requestAnimationFrame(autoScroll);
  }

  async function drop(cancelled) {
    const d = dragging; cancelAnimationFrame(d.raf);
    const list = d.slot.parentElement;
    const colId = list && list.dataset.col;
    // susjedi oko mjesta umetanja (stvarni redoslijed, ne filtrirani)
    let order = null;
    if (!cancelled && colId) {
      const prevEl = prevCard(d.slot), nextEl = nextCard(d.slot);
      const prev = prevEl ? tasks.get(prevEl.dataset.id) : null, next = nextEl ? tasks.get(nextEl.dataset.id) : null;
      if (prev && next) order = (prev.order + next.order) / 2;
      else if (prev) order = prev.order + 1024;
      else if (next) order = next.order - 1024;
      else { const all = sorted(colId).filter(([i]) => i !== d.id); order = all.length ? all[all.length - 1][1].order + 1024 : 1024; }
    }
    d.ghost.remove(); d.slot.remove(); d.card.classList.remove("is-dragging");
    document.body.classList.remove("dragging");
    board.querySelectorAll(".col.is-over").forEach(c => c.classList.remove("is-over"));
    dragging = null;
    const t = tasks.get(d.id);
    if (order !== null && t && (t.column !== colId || t.order !== order)) {
      const prevCol = t.column;
      tasks.set(d.id, { ...t, column: colId, order });  // odmah na novom mjestu
      render();
      try {
        await coll.doc(d.id).update({ column: colId, order, updatedAt: new Date().toISOString() });
        if (prevCol !== colId) toast(`Premješteno u „${colName(colId)}"`);
      } catch (err) { tasks.set(d.id, t); render(); writeFailed(err); }
    } else { render(); }
    if (renderPending) { renderPending = false; render(); }
  }
  const prevCard = n => { let p = n.previousElementSibling; while (p && !p.classList.contains("card")) p = p.previousElementSibling; return p; };
  const nextCard = n => { let p = n.nextElementSibling; while (p && !p.classList.contains("card")) p = p.nextElementSibling; return p; };

  function writeFailed(err) {
    const code = err && err.code;
    if (code === "invalid_argument" && !$(".scrim")) { canWrite = false; render(); setStatus("Ovu tablu možeš samo gledati. Izmjene može praviti vlasnik ili saradnik.", false); return; }
    if (code === "quota_exceeded") { toast("Tabla je puna. Obriši stare zadatke iz „Gotovo”."); return; }
    toast("Izmjena nije sačuvana. Pokušaj ponovo.");
  }

  // ---------- list za unos i izmjenu ----------
  function openSheet(id, colId) {
    if (!canWrite && !id) return;
    const t = id ? tasks.get(id) : { column: colId || "backlog", area: filter || "proizvod", priority: "" };
    if (!t) return;
    const ro = !canWrite;
    const opts = (list, val) => list.map(o => el("option", { value: o.id, selected: o.id === (val || "") }, o.name));
    const title = el("input", { id: "f-title", type: "text", maxlength: "200", required: true, value: t.title || "", disabled: ro });
    const note = el("textarea", { id: "f-note", maxlength: "2000", disabled: ro }); note.value = t.note || "";
    const col = el("select", { id: "f-col", disabled: ro }, ...opts(COLS, t.column));
    const area = el("select", { id: "f-area", disabled: ro }, ...opts(AREAS, t.area));
    const prio = el("select", { id: "f-prio", disabled: ro }, ...opts(PRIOS, t.priority));
    const due = el("input", { id: "f-due", type: "date", value: t.due || "", disabled: ro });
    const err = el("div", { class: "err", role: "alert" });
    const save = el("button", { class: "btn btn--primary", type: "submit", text: id ? "Sačuvaj" : "Dodaj zadatak", hidden: ro });
    const cancel = el("button", { class: "btn btn--ghost", type: "button", text: ro ? "Zatvori" : "Otkaži" });
    const del = id && !ro ? el("button", { class: "btn btn--ghost", type: "button", text: "Obriši", style: "color:var(--bad)" }) : null;

    const form = el("form", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sheet-h" },
      el("h2", { id: "sheet-h", text: id ? (ro ? "Zadatak" : "Izmijeni zadatak") : "Novi zadatak" }),
      el("div", { class: "field" }, el("label", { for: "f-title", text: "Naslov" }), title),
      el("div", { class: "field" }, el("label", { for: "f-note", text: "Bilješka" }), note),
      el("div", { class: "row" },
        el("div", { class: "field" }, el("label", { for: "f-col", text: "Kolona" }), col),
        el("div", { class: "field" }, el("label", { for: "f-area", text: "Oblast" }), area)),
      el("div", { class: "row" },
        el("div", { class: "field" }, el("label", { for: "f-prio", text: "Prioritet" }), prio),
        el("div", { class: "field" }, el("label", { for: "f-due", text: "Rok" }), due)),
      err,
      el("div", { class: "sheet__bar" }, del, el("div", { class: "right" }, cancel, save)));
    const scrim = el("div", { class: "scrim" }, form);
    const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); if (renderPending) { renderPending = false; render(); } };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    scrim.addEventListener("pointerdown", e => { if (e.target === scrim) close(); });
    cancel.onclick = close;

    if (del) {
      let armed = false;
      del.onclick = async () => {
        if (!armed) { armed = true; del.textContent = "Sigurno? Obriši"; del.className = "btn btn--danger"; return; }
        del.disabled = true;
        try { await coll.doc(id).delete(); close(); toast("Zadatak obrisan"); }
        catch (e2) { del.disabled = false; err.textContent = "Brisanje nije uspjelo. Pokušaj ponovo."; }
      };
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      if (ro) return;
      const name = title.value.trim();
      if (!name) { err.textContent = "Upiši naslov zadatka."; title.focus(); return; }
      const data = { title: name, note: note.value.trim(), column: col.value, area: area.value, priority: prio.value, due: due.value, updatedAt: new Date().toISOString() };
      if (!id || t.column !== col.value) {
        const last = sorted(col.value).filter(([i]) => i !== id).pop();
        data.order = last ? (last[1].order ?? 0) + 1024 : 1024;
      } else data.order = t.order ?? 1024;
      save.disabled = true; save.textContent = "Čuvam…";
      try {
        if (id) await coll.doc(id).set({ ...t, ...data });
        else await coll.doc().set({ ...data, createdAt: data.updatedAt });
        close(); toast(id ? "Sačuvano" : `Dodano u „${colName(data.column)}"`);
      } catch (e2) {
        save.disabled = false; save.textContent = id ? "Sačuvaj" : "Dodaj zadatak";
        err.textContent = e2 && e2.code === "invalid_argument" ? "Nemaš pravo da mijenjaš ovu tablu." : "Nije sačuvano. Pokušaj ponovo.";
      }
    });

    document.body.append(scrim);
    (ro ? cancel : title).focus();
  }
  addBtn.onclick = () => openSheet(null, "week");

  // ---------- baza ----------
  renderFilters();
  render();

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") {
      setStatus("Tabla čuva zadatke na claude.ai. Otvori je tamo, prijavljen, da vidiš i mijenjaš zadatke.", true); return;
    }
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    db = dbNs;
    if (!db) { setStatus("Zadaci se ne mogu učitati u ovom prikazu. Prijavi se na claude.ai i otvori tablu ponovo.", true); return; }
    coll = db.collection("tasks");
    let w = null;
    try { w = user ? await user.can("data.write") : null; } catch { w = null; }
    canWrite = w !== false;
    const loadTimer = setTimeout(() => setStatus("Zadaci se još ne mogu učitati. Provjeri vezu; tabla će se sama osvježiti.", true), 10000);
    coll.onSnapshot(snap => {
      const next = new Map();
      for (const d of snap.docs) if (d.exists) next.set(d.id, d.data());
      tasks = next;
      if (!snap.metadata.fromCache) clearTimeout(loadTimer);
      if (!snap.metadata.fromCache || tasks.size) {
        setStatus(tasks.size ? (canWrite ? null : "Ovu tablu možeš samo gledati.") :
          (canWrite ? "Još nema zadataka. Dodaj prvi dugmetom „+ Zadatak” ili zamoli Claudea da ga upiše." : "Još nema zadataka."));
      }
      render();
    }, e => {
      clearTimeout(loadTimer);
      if (e && e.code === "revoked") { canWrite = false; render(); setStatus("Pristup tabli je promijenjen.", true); }
      else setStatus("Veza sa zadacima je prekinuta. Osvježi stranicu.", true);
    });
  }
  start();
})();
</script>
