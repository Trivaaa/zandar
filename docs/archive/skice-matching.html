<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablić - Žandar — Matching screen (skica)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* tokeni iz Design System §6 */
    --surface:#18181b; --surface-raised:#232327; --felt:#1f3a2e;
    --text:#f4f4f5; --text-muted:#a1a1aa;
    --accent:#e0a92e; --accent-contrast:#1a1a1a;
    --team-a:#3b9e75; --team-b:#c2603a;
    --turn-ring:var(--accent); --danger:#d24b4b; --success:#3b9e75;
    --radius-md:10px; --radius-lg:14px;
    /* avatar boje (neutralna paleta izvedena iz tokena) */
    --av1:#3b9e75; --av2:#c2603a; --av3:#4a7fb5; --av4:#9b6dc7; --av5:#d9a441;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Outfit',system-ui,sans-serif;
    background:#0e0e10;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  /* telefon okvir samo za skicu */
  .phone{
    width:100%; max-width:390px; height:760px; max-height:92vh;
    background:
      radial-gradient(120% 70% at 50% 18%, rgba(224,169,46,.10), transparent 60%),
      linear-gradient(180deg, var(--surface) 0%, #121214 100%);
    border-radius:28px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex; flex-direction:column;
  }

  /* gornji brend */
  .brand{
    text-align:center; padding:26px 20px 6px;
  }
  .brand .logo{
    font-weight:800; font-size:13px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent);
  }
  .brand .sub{ font-size:11px; color:var(--text-muted); letter-spacing:.04em; margin-top:4px;}

  /* status linija */
  .status{ text-align:center; padding:14px 20px 0;}
  .status h1{
    font-size:22px; font-weight:700; letter-spacing:-.01em;
    display:inline-flex; align-items:baseline; gap:2px;
  }
  .status .dots span{
    display:inline-block; animation:blink 1.4s infinite both; opacity:.3; font-weight:700;
  }
  .status .dots span:nth-child(2){animation-delay:.2s;}
  .status .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .status .count{ margin-top:8px; font-size:13px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .status .count b{ color:var(--accent); font-weight:700;}

  /* sto */
  .table-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:8px 22px;}
  .felt{
    position:relative; width:300px; height:380px;
    border-radius:150px/190px;
    background:
      radial-gradient(120% 120% at 50% 30%, #27523f 0%, var(--felt) 55%, #163026 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,.45), 0 0 0 8px rgba(0,0,0,.25), 0 0 0 9px rgba(224,169,46,.12);
  }
  /* radar puls dok traži */
  .felt::before, .felt::after{
    content:""; position:absolute; left:50%; top:50%; width:60px; height:60px;
    border:1px solid rgba(224,169,46,.5); border-radius:50%;
    transform:translate(-50%,-50%) scale(.6); opacity:0;
  }
  .felt.searching::before{ animation:radar 2.2s ease-out infinite; }
  .felt.searching::after{ animation:radar 2.2s ease-out infinite 1.1s; }
  @keyframes radar{
    0%{opacity:.6; transform:translate(-50%,-50%) scale(.4);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(3.4);}
  }

  /* sjedišta */
  .seat{ position:absolute; width:104px; transform:translate(-50%,-50%); text-align:center;}
  .seat.top{ left:50%; top:14%; }
  .seat.left{ left:6%; top:50%; }
  .seat.right{ left:94%; top:50%; }
  .seat.bottom{ left:50%; top:86%; }

  .puck{
    width:54px; height:54px; border-radius:50%; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:#fff;
    position:relative;
  }
  /* prazno sjedište dok čeka */
  .puck.empty{
    background:rgba(255,255,255,.05);
    border:2px dashed rgba(255,255,255,.18);
    color:transparent;
  }
  .puck.empty::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:2px solid transparent; border-top-color:rgba(224,169,46,.55);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .puck.filled{ border:2px solid rgba(255,255,255,.14); }
  .seat .name{
    margin-top:7px; font-size:12px; font-weight:500; color:var(--text);
    max-width:104px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    opacity:0;
  }
  .seat .tag{
    margin-top:2px; font-size:10px; color:var(--success); font-weight:600; opacity:0; height:12px;
  }
  .seat.you .tag{ color:var(--accent); }

  /* animacija ulaska */
  .seat.joined .puck{ animation:pop .42s cubic-bezier(.18,.9,.3,1.3); }
  .seat.joined .name{ animation:fadeUp .4s ease forwards .05s; }
  .seat.joined .tag{ animation:tagFlash 1.6s ease forwards; }
  @keyframes pop{0%{transform:scale(.2); opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1); opacity:1;}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(4px);}to{opacity:1; transform:translateY(0);}}
  @keyframes tagFlash{0%{opacity:0; transform:translateY(2px);}15%{opacity:1; transform:translateY(0);}70%{opacity:1;}100%{opacity:0;}}

  /* progress bar */
  .bar-wrap{ padding:0 30px 6px;}
  .bar{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden;}
  .bar > i{ display:block; height:100%; width:25%; background:var(--accent); border-radius:4px; transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* ready state */
  .ready-msg{
    text-align:center; padding:4px 20px 0; height:22px;
    font-size:14px; font-weight:700; color:var(--success); opacity:0;
    transition:opacity .3s;
  }
  .ready-msg.show{ opacity:1; }

  /* footer skica */
  .foot{ padding:14px 20px 26px; text-align:center;}
  .replay{
    background:var(--accent); color:var(--accent-contrast); border:none;
    font-family:inherit; font-weight:700; font-size:14px; padding:11px 22px;
    border-radius:var(--radius-md); cursor:pointer; transition:transform .1s, filter .15s;
  }
  .replay:active{ transform:scale(.97); }
  .note{ margin-top:12px; font-size:10px; color:var(--text-muted); line-height:1.5;}
  .note b{ color:var(--text); font-weight:600;}
</style>
</head>
<body>
  <div class="phone">
    <div class="brand">
      <div class="logo">Tablić&nbsp;-&nbsp;Žandar</div>
      <div class="sub">kartaonica.com</div>
    </div>

    <div class="status">
      <h1 id="headline">Tražimo igrače<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
      <div class="count">Spremni: <b id="cnt">1</b> / 4</div>
    </div>

    <div class="table-wrap">
      <div class="felt searching" id="felt">
        <div class="seat top" id="s-top"><div class="puck empty"></div><div class="name"></div><div class="tag">se pridružio</div></div>
        <div class="seat left" id="s-left"><div class="puck empty"></div><div class="name"></div><div class="tag">se pridružio</div></div>
        <div class="seat right" id="s-right"><div class="puck empty"></div><div class="name"></div><div class="tag">se pridružio</div></div>
        <div class="seat bottom you joined" id="s-you"><div class="puck filled" style="background:var(--av5)">T</div><div class="name" style="opacity:1">Ti</div><div class="tag" style="opacity:1; animation:none">spreman</div></div>
      </div>
    </div>

    <div class="bar-wrap"><div class="bar"><i id="bar"></i></div></div>
    <div class="ready-msg" id="ready">Sto spreman — počinjemo!</div>

    <div class="foot">
      <button class="replay" id="replay">▷ Pusti ponovo</button>
      <div class="note"><b>Throwaway skica</b> · neutralni tokeni (brend = Faza 2)<br>3–5s, staggered ulazak, varirana imena svaki put</div>
    </div>
  </div>

<script>
  const POOLS = {
    full: ["Marko Petrović","Ana Kovačević","Nemanja Ilić","Jelena Marić","Stefan Jović","Milica Savić","Vuk Knežević","Sara Begić"],
    nicknum: ["deki92","ana_88","zoki_023","pera774","marko1991","maja.95","sale_011"],
    handle: ["CrniVuk","RakijaBoss","vukNS","Legenda011","KaubojSa","FantomBG","SokoZG"],
    guest: ["guest1244","Gost8821","Igrac_4471","Player7732"],
    ironic: ["ČikaMika","Pivopija","KumIzSela","KomšijaPero","TetkaRada"]
  };
  const AV = ["var(--av1)","var(--av2)","var(--av3)","var(--av4)"];
  const seats = ["s-top","s-left","s-right"];
  let timers = [];

  const rint = (a,b)=> a + Math.random()*(b-a);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const initial = s => (s.match(/[A-Za-zŠĐŽČĆšđžčć]/)?.[0] || s[0] || "?").toUpperCase();

  function pickThreeNames(){
    // po jedan iz različitih kategorija da izgleda raznoliko + životno
    const cats = ["full","nicknum","handle","guest","ironic"];
    const chosen = cats.sort(()=>Math.random()-.5).slice(0,3);
    const used = new Set();
    return chosen.map(c=>{
      let n; let guard=0;
      do { n = pick(POOLS[c]); guard++; } while(used.has(n) && guard<10);
      used.add(n); return n;
    });
  }

  function resetSeat(id){
    const el = document.getElementById(id);
    el.classList.remove("joined");
    const puck = el.querySelector(".puck");
    puck.className = "puck empty"; puck.textContent = ""; puck.style.background = "";
    const name = el.querySelector(".name"); name.textContent=""; name.style.opacity="0"; name.style.animation="";
    const tag = el.querySelector(".tag"); tag.style.opacity="0"; tag.style.animation="";
  }

  function fillSeat(id, name, color){
    const el = document.getElementById(id);
    const puck = el.querySelector(".puck");
    puck.className = "puck filled";
    puck.style.background = color;
    puck.textContent = initial(name);
    el.querySelector(".name").textContent = name;
    // re-trigger animacije
    void el.offsetWidth;
    el.classList.add("joined");
  }

  function startMatch(){
    timers.forEach(clearTimeout); timers = [];
    const felt = document.getElementById("felt");
    const cnt = document.getElementById("cnt");
    const bar = document.getElementById("bar");
    const ready = document.getElementById("ready");
    const headline = document.getElementById("headline");

    felt.classList.add("searching");
    ready.classList.remove("show");
    headline.innerHTML = 'Tražimo igrače<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    cnt.textContent = "1";
    bar.style.width = "25%";
    seats.forEach(resetSeat);

    const names = pickThreeNames();
    // staggered, blago neravnomjerni intervali (realan matchmaking nije ravnomjeran)
    const t1 = rint(700, 1100);
    const t2 = t1 + rint(900, 1500);
    let t3 = t2 + rint(1000, 1600);
    if (t3 > 4300) t3 = 4300;            // clamp da ready stane ispod 5s
    const tReady = t3 + 550;

    const joins = [
      {id:"s-top",   t:t1, n:names[0], c:AV[0], k:2},
      {id:"s-left",  t:t2, n:names[1], c:AV[1], k:3},
      {id:"s-right", t:t3, n:names[2], c:AV[2], k:4},
    ];

    joins.forEach(j=>{
      timers.push(setTimeout(()=>{
        fillSeat(j.id, j.n, j.c);
        cnt.textContent = j.k;
        bar.style.width = (j.k*25) + "%";
      }, j.t));
    });

    timers.push(setTimeout(()=>{
      felt.classList.remove("searching");
      headline.textContent = "Sto je popunjen";
      ready.classList.add("show");
    }, tReady));
  }

  document.getElementById("replay").addEventListener("click", startMatch);
  startMatch();
</script>
</body>
</html>
